<title>끊어진 사슬</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one letterboxed stage; story cards sit low-left over the scene like a page torn from a travel journal.
   Single dark world by choice: the game itself carries the light, brightening chapter by chapter toward dawn. */
:root{
  --night:#0c0a13;
  --ink:#f2ead9;
  --mist:#a69fb6;
  --silver:#d6dbe6;
  --accent:#ffb35a;
  --veil:rgba(12,10,19,.84);
  --display:"Song Myung","Gowun Batang","Batang",serif;
  --body:"Gowun Batang","Batang","Noto Serif KR",serif;
  --ui:"Gowun Dodum","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--night);color:var(--ink);font-family:var(--ui);
  overflow:hidden;margin:0;
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;touch-action:none;
}
#stage{height:100%;display:flex;align-items:center;justify-content:center}
#frame{position:relative;--s:1;box-shadow:0 0 0 1px rgba(214,219,230,.08),0 30px 80px rgba(0,0,0,.6)}
#game{display:block;width:100%;height:100%}

#panel{
  position:absolute;left:6%;bottom:9%;
  width:min(58%,calc(var(--s)*560px));
  padding:calc(var(--s)*26px) calc(var(--s)*30px);
  background:var(--veil);
  border:1px solid rgba(214,219,230,.28);
  outline:1px solid rgba(214,219,230,.12);outline-offset:calc(var(--s)*4px);
  font-size:calc(var(--s)*16px);
  display:flex;flex-direction:column;gap:calc(var(--s)*12px);
  animation:rise .5s ease-out both;
}
@keyframes rise{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#panel{animation:none}}
.eyebrow{margin:0;font-family:var(--ui);font-size:.78em;letter-spacing:.24em;color:var(--accent)}
.logo{margin:0;font-family:var(--display);font-weight:400;font-size:3.4em;line-height:1;letter-spacing:.04em;text-wrap:balance}
.chap{margin:0;font-family:var(--display);font-weight:400;font-size:2.4em;line-height:1.1;text-wrap:balance}
.story{margin:0;font-family:var(--body);font-size:1.02em;line-height:1.85;color:var(--ink);max-width:34em}
.story + .story{margin-top:-.3em}
.lede{margin:0;font-family:var(--body);line-height:1.8;color:var(--mist)}
.keys{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5em 1.4em;font-size:.86em}
.keys div{display:flex;align-items:baseline;gap:.6em}
.keys dt{font-family:var(--ui);min-width:4.2em;padding:.12em .5em;border:1px solid rgba(214,219,230,.35);text-align:center;color:var(--silver)}
.keys dd{margin:0;color:var(--mist)}
.stats{margin:0;display:flex;flex-wrap:wrap;gap:.4em 1.8em;font-size:.9em;color:var(--mist);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:400;font-family:var(--display);font-size:1.4em;margin-left:.3em}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:1em;margin-top:.3em}
.hint{font-size:.78em;color:var(--mist)}
#panel button{
  font:inherit;font-family:var(--ui);font-size:.95em;letter-spacing:.06em;
  padding:.6em 1.4em;border:0;cursor:pointer;
  background:var(--accent);color:var(--night);
}
#panel button:hover{filter:brightness(1.08)}
#panel button:focus-visible{outline:2px solid var(--silver);outline-offset:3px}

#touch{position:absolute;inset:0;pointer-events:none;display:none}
#touch.on{display:block}
.tb{
  position:absolute;bottom:5%;width:calc(var(--s)*86px);height:calc(var(--s)*86px);
  border-radius:50%;border:1px solid rgba(214,219,230,.35);background:rgba(12,10,19,.35);
  color:var(--silver);font-family:var(--ui);font-size:calc(var(--s)*20px);
  display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;
}
.tb.active{background:rgba(214,219,230,.25)}
#tl{left:3%}#tr{left:calc(3% + var(--s)*100px)}
#tj{right:3%;width:calc(var(--s)*100px);height:calc(var(--s)*100px)}
#ts{right:calc(3% + var(--s)*116px)}
@media (max-width:700px){#panel{width:86%;left:7%;bottom:6%;font-size:calc(var(--s)*20px)}.logo{font-size:2.6em}}
</style>

<div id="stage">
  <div id="frame">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="panel" hidden></div>
    <div id="touch">
      <div class="tb" id="tl" data-k="left">◀</div>
      <div class="tb" id="tr" data-k="right">▶</div>
      <div class="tb" id="ts" data-k="shoot">활</div>
      <div class="tb" id="tj" data-k="jump">점프</div>
    </div>
  </div>
</div>

<script>
(()=>{
const W=960,H=540,T=36,ROWS=15,STEP=1/120;
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const frame=document.getElementById('frame'),panel=document.getElementById('panel'),touch=document.getElementById('touch');
let K=1;

function fit(){
  const st=document.getElementById('stage');
  const s=Math.min(st.clientWidth/W,st.clientHeight/H);
  const fw=Math.floor(W*s),fh=Math.floor(H*s);
  frame.style.width=fw+'px';frame.style.height=fh+'px';frame.style.setProperty('--s',s);
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(fw*dpr);cv.height=Math.round(fh*dpr);K=cv.width/W;
}
addEventListener('resize',fit);fit();

/* ---------- level chunks (bottom 9 rows; top 6 rows are open sky) ---------- */
const CH={
  start:["............","............","............","............","............","............","..P.........","############","############"],
  flat:["............","............","............","............","............","....o..o....","............","############","############"],
  gap:["............","............","............","............",".....ooo....","............","............","####....####","####....####"],
  stairs:["...........o..","..........===.","..............","......===.....","..............","..===.........","..............","##############","##############"],
  spikes:["............","............","............","............","....ooo.....","............","....^^^.....","############","############"],
  guard:["..............","..............","..............","..............","..............","..............","......G.......","##############","##############"],
  wolf:["..............","..............","..............","..............","..............","..............","........W.....","##############","##############"],
  bat:["..............","..............","..............","......B.......","..............","..............","..............","##############","##############"],
  pitplat:["................","................","................",".......oo.......","................","......====......","................","###..........###","###..........###"],
  mover:["..................","..................","..................","..................","........o.........","..................","....M.............","###............###","###............###"],
  wall:["............","............","......o.....","............",".....###....",".....###....",".....###....","############","############"],
  check:["..........","..........","..........","..........","..........","..........","....C.....","##########","##########"],
  end:["................","................","................","................","................","................","..........E.....","################","################"],
};

const THEMES={
  dungeon:{sky:['#07060c','#130f1e','#1d1630'],far:'#1f1930',mid:'#2b2240',tile:'#3a3148',tileDark:'#29213a',top:'#6a5d80',plank:'#6e4b30',plankDark:'#3e2a1b',accent:'#ffb35a',vig:.78,amb:'dust',bricks:true},
  city:{sky:['#22173a','#7a3f5c','#e8915e'],far:'#4c2e50',mid:'#2d1f39',tile:'#463647',tileDark:'#33263a',top:'#a07670',plank:'#7a5236',plankDark:'#46301f',accent:'#ffd27a',vig:.45,amb:'embers',bricks:true},
  forest:{sky:['#07171c','#113039','#285449'],far:'#16393a',mid:'#0d2826',tile:'#3a2c22',tileDark:'#2a1f18',top:'#5f9c4c',plank:'#6b4a2e',plankDark:'#3b2817',accent:'#c8f59a',vig:.5,amb:'fireflies',bricks:false},
  peak:{sky:['#3b5d93','#a3b6d1','#f7d4a6'],far:'#8a9bbb',mid:'#5c6f92',tile:'#5c6273',tileDark:'#454a5a',top:'#f3f6fb',plank:'#7c5a3c',plankDark:'#4a3523',accent:'#fff0b8',vig:.18,amb:'wind',bricks:false},
};

const CHAPTERS=[
  {key:'dungeon',no:'제1장',name:'철창 아래',
   text:['그라벤 영주의 성 지하. 은 사슬이 세린의 손목을 묶은 지 백 번째 겨울이 지났다.','오늘 밤, 녹슨 고리 하나가 끊어졌다. 높은 창살 틈으로 별빛이 새어 든다. 경비병이 돌아오기 전에 빛을 따라 위로.'],
   seq:['start','flat','guard','spikes','gap','guard','wall','check','stairs','spikes','guard','pitplat','guard','end']},
  {key:'city',no:'제2장',name:'잿빛 지붕',
   text:['성 밖은 굴뚝 연기로 뒤덮인 도시였다. 경종이 울리고 추격대가 거리를 메운다.','땅으로는 갈 수 없다. 지붕과 지붕 사이를 건너 서쪽 성벽 너머로.'],
   seq:['start','gap','bat','stairs','mover','guard','check','gap','bat','guard','pitplat','check','mover','bat','spikes','gap','guard','end']},
  {key:'forest',no:'제3장',name:'잊힌 숲',
   text:['성벽 너머에 숲이 있었다. 세린이 태어난 숲은 아니지만, 나무들은 엘프의 발소리를 기억한다.','그림자 늑대가 숲을 지키고, 반딧불이 길을 비춘다.'],
   seq:['start','wolf','stairs','flat','wolf','pitplat','bat','check','wall','wolf','mover','stairs','guard','wolf','gap','bat','end']},
  {key:'peak',no:'제4장',name:'바람의 고개',
   text:['숲 끝에서 산이 시작되었다. 고개를 넘으면 어떤 영주의 땅도 아닌, 바람만 사는 곳이 있다고 했다.','마지막 추격대가 눈길을 따라온다. 해가 다 뜨기 전에 정상으로.'],
   seq:['start','gap','bat','wolf','mover','spikes','check','guard','pitplat','bat','wall','wolf','check','mover','gap','stairs','bat','guard','wolf','end']},
];

function buildLevel(i){
  const ch=CHAPTERS[i];
  const rows=Array.from({length:ROWS},()=>'');
  for(const k of ch.seq){
    const c=CH[k];const w=Math.max(...c.map(s=>s.length));
    for(let r=0;r<ROWS;r++){
      if(r<6){rows[r]+='.'.repeat(w);continue;}
      let s=c[r-6];const pad=r>=13?s[s.length-1]:'.';
      while(s.length<w)s+=pad;rows[r]+=s;
    }
  }
  const L={key:ch.key,th:THEMES[ch.key],cols:rows[0].length,grid:rows.map(s=>s.split('')),enemies:[],stars:[],movers:[],cps:[],exit:null,spawn:{x:80,y:0}};
  for(let r=0;r<ROWS;r++)for(let c=0;c<L.cols;c++){
    const t=L.grid[r][c];let clear=true;
    if(t==='P')L.spawn={x:c*T+7,y:(r+1)*T-42};
    else if(t==='o')L.stars.push({x:c*T+T/2,y:r*T+T/2,got:false,ph:Math.random()*6});
    else if(t==='G')L.enemies.push({type:'guard',x:c*T+5,y:(r+1)*T-46,w:26,h:46,hp:2,dir:-1,anim:0,flash:0});
    else if(t==='W')L.enemies.push({type:'wolf',x:c*T,y:(r+1)*T-28,w:44,h:28,hp:1,dir:-1,anim:0,flash:0});
    else if(t==='B')L.enemies.push({type:'bat',x:c*T,y:r*T,w:30,h:20,hp:1,dir:-1,anim:0,flash:0,ox:c*T,oy:r*T,t:Math.random()*6});
    else if(t==='M')L.movers.push({x:c*T,y:r*T,w:T*3,h:12,ox:c*T,range:T*8,speed:75,dir:1,dx:0});
    else if(t==='C')L.cps.push({x:c*T+T/2,y:(r+1)*T,lit:false});
    else if(t==='E')L.exit={x:c*T,y:(r+1)*T};
    else clear=false;
    if(clear)L.grid[r][c]='.';
  }
  return L;
}
const STARS_TOTAL=CHAPTERS.reduce((n,_,i)=>n+buildLevel(i).stars.length,0);

/* ---------- state ---------- */
let L=null,P=null,camX=0,arrows=[],parts=[],amb=[],checkpoint=null,clock=0;
const S={mode:'title',ch:0,hp:3,maxHp:3,stars:0,time:0,falls:0,fade:0,shake:0};

function newPlayer(x,y){return{x,y,w:22,h:42,vx:0,vy:0,onGround:false,facing:1,coyote:0,jumpBuf:0,air:1,inv:0,hurtT:0,shootCd:0,shootT:0,anim:0,on:null};}
function loadLevel(i){
  L=buildLevel(i);P=newPlayer(L.spawn.x,L.spawn.y);P.onGround=true;
  checkpoint={x:L.spawn.x,y:L.spawn.y};camX=0;arrows=[];parts=[];
  amb=Array.from({length:55},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random(),p:Math.random()*6}));
  frame.style.setProperty('--accent',L.th.accent);
}

/* ---------- input ---------- */
const keys={};const inp={left:false,right:false,jumpHeld:false,shoot:false};
const JUMP=['Space','KeyW','ArrowUp','KeyZ'],SHOOT=['KeyJ','KeyX'],GAME=[...JUMP,...SHOOT,'ArrowLeft','ArrowRight','ArrowDown','KeyA','KeyD'];
function refresh(){
  inp.left=!!(keys.ArrowLeft||keys.KeyA||keys.vleft);
  inp.right=!!(keys.ArrowRight||keys.KeyD||keys.vright);
  inp.jumpHeld=!!(JUMP.some(k=>keys[k])||keys.vjump);
}
function pressJump(){if(S.mode==='play'&&P)P.jumpBuf=0.13;}
function pressShoot(){if(S.mode==='play')inp.shoot=true;}
addEventListener('keydown',e=>{
  if(!panel.hidden&&(e.code==='Enter'||e.code==='Space')){
    e.preventDefault();if(!e.repeat){const b=panel.querySelector('button');b&&b.click();}return;
  }
  if(e.code==='Escape'||e.code==='KeyP'){togglePause();return;}
  if(e.code==='KeyM'){muted=!muted;return;}
  if(GAME.includes(e.code))e.preventDefault();
  if(!e.repeat){if(JUMP.includes(e.code))pressJump();if(SHOOT.includes(e.code))pressShoot();}
  keys[e.code]=true;refresh();
});
addEventListener('keyup',e=>{keys[e.code]=false;refresh();});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;refresh();});
touch.querySelectorAll('.tb').forEach(b=>{
  const k=b.dataset.k;
  const down=e=>{e.preventDefault();initAudio();b.classList.add('active');keys['v'+k]=true;if(k==='jump')pressJump();if(k==='shoot')pressShoot();refresh();};
  const up=e=>{e.preventDefault();b.classList.remove('active');keys['v'+k]=false;refresh();};
  b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);
});
const coarse=matchMedia('(pointer:coarse)').matches;

/* ---------- audio ---------- */
let AC=null,muted=false;
function initAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();else if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f1,f2,dur,type,vol,delay=0){
  const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02);
}
const SFX={
  jump:()=>tone(330,620,.12,'square',.04),dbl:()=>tone(520,1040,.16,'triangle',.07),
  shoot:()=>tone(900,240,.1,'triangle',.06),star:()=>{tone(988,988,.07,'sine',.07);tone(1480,1480,.16,'sine',.06,.07);},
  hurt:()=>tone(240,70,.28,'sawtooth',.07),hit:()=>tone(300,160,.08,'square',.05),kill:()=>tone(440,90,.22,'square',.05),
  check:()=>[523,659,784].forEach((f,i)=>tone(f,f,.16,'sine',.06,i*.08)),
  win:()=>[523,659,784,1046].forEach((f,i)=>tone(f,f,.35,'triangle',.06,i*.13)),
};
function sfx(n){if(muted||!AC)return;try{SFX[n]();}catch(e){}}

/* ---------- helpers ---------- */
const approach=(v,t,d)=>v<t?Math.min(v+d,t):Math.max(v-d,t);
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s);};
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function hexA(h,a){const n=parseInt(h.slice(1),16);return`rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;}
function tileAt(c,r){if(c<0||c>=L.cols)return'#';if(r<0||r>=ROWS)return'.';return L.grid[r][c];}
function burst(x,y,n,color,sp=160,g=300,size=3){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=sp*(.3+Math.random()*.7);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sp*.3,life:.5+Math.random()*.4,max:.9,color,size:size*(.6+Math.random()*.6),g});}}

/* ---------- physics ---------- */
function collideX(o){
  const r0=Math.floor(o.y/T),r1=Math.floor((o.y+o.h-.01)/T);
  if(o.vx>0){const c=Math.floor((o.x+o.w)/T);for(let r=r0;r<=r1;r++)if(tileAt(c,r)==='#'){o.x=c*T-o.w-.01;o.vx=0;return true;}}
  else if(o.vx<0){const c=Math.floor(o.x/T);for(let r=r0;r<=r1;r++)if(tileAt(c,r)==='#'){o.x=(c+1)*T+.01;o.vx=0;return true;}}
  return false;
}
function collideY(o,prevBottom){
  o.onGround=false;
  const c0=Math.floor(o.x/T),c1=Math.floor((o.x+o.w-.01)/T);
  if(o.vy>=0){
    const r=Math.floor((o.y+o.h)/T);
    for(let c=c0;c<=c1;c++){const t=tileAt(c,r);if(t==='#'||(t==='='&&prevBottom<=r*T+.5)){o.y=r*T-o.h;o.vy=0;o.onGround=true;return;}}
  }else{
    const r=Math.floor(o.y/T);
    for(let c=c0;c<=c1;c++)if(tileAt(c,r)==='#'){o.y=(r+1)*T;o.vy=0;return;}
  }
}

function hurt(fromX){
  if(P.inv>0)return;
  S.hp--;P.inv=1.3;P.hurtT=.25;P.vy=-420;P.vx=(P.x+P.w/2<fromX?-1:1)*260;S.shake=.3;
  sfx('hurt');burst(P.x+P.w/2,P.y+20,12,'#ff8f9c',180);
  if(S.hp<=0)respawn();
}
function respawn(){
  S.hp=S.maxHp;S.falls++;S.fade=1;
  P.x=checkpoint.x;P.y=checkpoint.y;P.vx=P.vy=0;P.inv=1.5;P.on=null;P.hurtT=0;
}
function damage(e,n,dir){
  e.hp-=n;e.flash=.12;e.x+=dir*6;
  if(e.hp<=0){e.dead=true;sfx('kill');burst(e.x+e.w/2,e.y+e.h/2,18,e.type==='guard'?'#c9cdd6':'#6c5a8a',200);}
  else sfx('hit');
}

function update(dt){
  S.time+=dt;
  if(S.shake>0)S.shake-=dt;
  if(S.fade>0)S.fade=Math.max(0,S.fade-dt*1.6);
  for(const m of L.movers){
    const old=m.x;m.x+=m.dir*m.speed*dt;
    if(m.x>m.ox+m.range){m.x=m.ox+m.range;m.dir=-1;}if(m.x<m.ox){m.x=m.ox;m.dir=1;}
    m.dx=m.x-old;
  }
  const p=P;
  if(p.on){p.x+=p.on.dx;p.on=null;}
  const dir=(inp.right?1:0)-(inp.left?1:0);
  if(p.hurtT>0)p.hurtT-=dt;
  else p.vx=approach(p.vx,dir*270,(p.onGround?2600:1700)*dt);
  if(dir&&p.hurtT<=0)p.facing=dir;
  p.coyote=p.onGround?.1:Math.max(0,p.coyote-dt);
  if(p.onGround)p.air=1;
  if(p.jumpBuf>0){
    p.jumpBuf-=dt;
    if(p.coyote>0){p.vy=-730;p.coyote=0;p.jumpBuf=0;p.onGround=false;sfx('jump');burst(p.x+p.w/2,p.y+p.h,6,'rgba(220,220,230,.6)',80,200,2);}
    else if(p.air>0){p.vy=-660;p.air=0;p.jumpBuf=0;sfx('dbl');for(let i=0;i<10;i++){const a=i/10*Math.PI*2;parts.push({x:p.x+p.w/2,y:p.y+p.h,vx:Math.cos(a)*120,vy:Math.sin(a)*40,life:.4,max:.4,color:L.th.accent,size:2.5,g:0});}}
  }
  let g=2100;if(!inp.jumpHeld&&p.vy<0)g*=2.3;
  p.vy=Math.min(p.vy+g*dt,950);
  if(p.shootCd>0)p.shootCd-=dt;if(p.shootT>0)p.shootT-=dt;
  if(inp.shoot){inp.shoot=false;if(p.shootCd<=0){p.shootCd=.32;p.shootT=.22;arrows.push({x:p.x+p.w/2+p.facing*12,y:p.y+14,vx:p.facing*760,life:.85});sfx('shoot');}}
  p.x+=p.vx*dt;collideX(p);
  const wasGround=p.onGround,prevBottom=p.y+p.h,fallV=p.vy;
  p.y+=p.vy*dt;collideY(p,prevBottom);
  for(const m of L.movers){
    if(p.vy>=0&&p.x+p.w>m.x&&p.x<m.x+m.w&&prevBottom<=m.y+1&&p.y+p.h>=m.y){p.y=m.y-p.h;p.vy=0;p.onGround=true;p.on=m;}
  }
  if(!wasGround&&p.onGround&&fallV>500)burst(p.x+p.w/2,p.y+p.h,5,'rgba(220,220,230,.5)',70,150,2);
  p.anim+=Math.abs(p.vx)*dt*.045;
  if(p.inv>0)p.inv-=dt;

  // spikes
  const sc0=Math.floor(p.x/T),sc1=Math.floor((p.x+p.w)/T),sr0=Math.floor(p.y/T),sr1=Math.floor((p.y+p.h)/T);
  for(let r=sr0;r<=sr1;r++)for(let c=sc0;c<=sc1;c++)if(tileAt(c,r)==='^'&&overlap(p,{x:c*T+4,y:r*T+16,w:T-8,h:T-16})){hurt(c*T+T/2);p.vy=-560;}
  // pit
  if(p.y>H+60){S.hp--;sfx('hurt');if(S.hp<=0)S.hp=S.maxHp;S.falls++;S.fade=1;p.x=checkpoint.x;p.y=checkpoint.y;p.vx=p.vy=0;p.inv=1.5;}

  // enemies
  for(const e of L.enemies){
    if(e.dead)continue;
    if(e.flash>0)e.flash-=dt;
    e.anim+=dt;
    if(e.type==='bat'){
      e.t+=dt;
      const px=p.x+p.w/2,py=p.y+p.h/2,cx=e.x+e.w/2,cy=e.y+e.h/2;
      let tx=e.ox+Math.sin(e.t*1.1)*80,ty=e.oy+Math.sin(e.t*2.3)*40;
      const d=Math.hypot(px-cx,py-cy);if(d<230){tx=px-e.w/2;ty=py-e.h/2;}
      const dx=tx-e.x,dy=ty-e.y,dl=Math.hypot(dx,dy)||1,st=Math.min(dl,(d<230?95:120)*dt);
      e.x+=dx/dl*st;e.y+=dy/dl*st;e.dir=dx<0?-1:1;
    }else{
      const chase=e.type==='guard'&&Math.abs(p.x-e.x)<260&&Math.abs((p.y+p.h)-(e.y+e.h))<50;
      if(chase)e.dir=p.x<e.x?-1:1;
      const sp=e.type==='wolf'?130:(chase?115:55);
      const front=e.dir>0?e.x+e.w+2:e.x-2,fc=Math.floor(front/T);
      const ground=tileAt(fc,Math.floor((e.y+e.h+2)/T)),wall=tileAt(fc,Math.floor((e.y+e.h-4)/T));
      const blocked=!(ground==='#'||ground==='=')||wall==='#';
      if(blocked){if(!chase)e.dir*=-1;}else e.x+=e.dir*sp*dt;
    }
    if(overlap(p,e)){
      if(p.vy>120&&prevBottom-e.y<20){damage(e,1,p.facing);p.vy=-540;p.air=1;}
      else hurt(e.x+e.w/2);
    }
  }
  // arrows
  for(const a of arrows){
    a.x+=a.vx*dt;a.life-=dt;
    if(tileAt(Math.floor(a.x/T),Math.floor(a.y/T))==='#'){a.life=0;burst(a.x,a.y,4,'#b9a58a',60,200,2);continue;}
    for(const e of L.enemies){if(!e.dead&&a.x>e.x-4&&a.x<e.x+e.w+4&&a.y>e.y-4&&a.y<e.y+e.h+4){damage(e,1,Math.sign(a.vx));a.life=0;break;}}
  }
  arrows=arrows.filter(a=>a.life>0);
  // stars
  for(const s of L.stars){if(!s.got&&Math.hypot(s.x-(p.x+p.w/2),s.y-(p.y+p.h/2))<28){s.got=true;S.stars++;sfx('star');burst(s.x,s.y,10,L.th.accent,120,0,2.5);}}
  // checkpoints
  for(const c of L.cps){if(!c.lit&&Math.abs(c.x-(p.x+p.w/2))<26&&Math.abs(c.y-(p.y+p.h))<60){c.lit=true;checkpoint={x:c.x-p.w/2,y:c.y-p.h};S.hp=S.maxHp;sfx('check');burst(c.x+12,c.y-50,14,L.th.accent,120,-50,2.5);}}
  // exit
  if(L.exit&&overlap(p,{x:L.exit.x+4,y:L.exit.y-T*3,w:T-8,h:T*3}))completeChapter();
  // particles
  for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.g*dt;q.life-=dt;}
  parts=parts.filter(q=>q.life>0);
  // camera
  const target=p.x+p.w/2-W*.42+p.facing*50;
  camX+=(target-camX)*Math.min(1,dt*6);
  camX=Math.max(0,Math.min(L.cols*T-W,camX));
}

/* ---------- drawing: backgrounds ---------- */
function ridge(par,base,amp,seed,color,fr=1){
  ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,H);
  for(let sx=0;sx<=W+16;sx+=16){const x=(sx+camX*par)*fr;const n=.5*Math.sin(x*.0041+seed)+.3*Math.sin(x*.0107+seed*2.3)+.2*Math.sin(x*.023+seed*.7);ctx.lineTo(sx,base-amp*n);}
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();
}
function peaks(par,base,amp,seed,color,snow){
  const pts=[];
  for(let sx=-16;sx<=W+16;sx+=12){const x=sx+camX*par;const m=Math.pow(Math.abs(Math.sin(x*.0034+seed)),1.4)*.75+.25*Math.abs(Math.sin(x*.009+seed*1.7));pts.push([sx,base-amp*m]);}
  ctx.beginPath();ctx.moveTo(-16,H);pts.forEach(q=>ctx.lineTo(q[0],q[1]));ctx.lineTo(W+16,H);ctx.closePath();
  ctx.fillStyle=color;ctx.fill();
  if(snow){ctx.save();ctx.clip();ctx.fillStyle=snow;ctx.beginPath();ctx.moveTo(-16,0);pts.forEach(q=>ctx.lineTo(q[0],q[1]+26+Math.sin(q[0]*.13)*6));ctx.lineTo(W+16,0);ctx.closePath();ctx.fill();ctx.restore();}
}
function cells(par,size,fn){
  const off=camX*par,i0=Math.floor(off/size)-1,i1=Math.floor((off+W)/size)+1;
  for(let i=i0;i<=i1;i++)fn(i*size-off,i,hash(i));
}
function glow(x,y,r,color,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,hexA(color,a));g.addColorStop(1,hexA(color,0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);}

function drawBackground(t){
  const th=L.th;
  const sg=ctx.createLinearGradient(0,0,0,H);th.sky.forEach((c,i)=>sg.addColorStop(i/(th.sky.length-1),c));
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);
  if(L.key==='dungeon'){
    ctx.fillStyle=th.far;ctx.fillRect(0,0,W,H);
    // stone courses
    ctx.fillStyle='rgba(0,0,0,.18)';const o=camX*.25;
    for(let y=20;y<H;y+=44){ctx.fillRect(0,y,W,2);for(let x=-(o%90)+((y/44)%2)*45;x<W;x+=90)ctx.fillRect(x,y-42,2,42);}
    // barred windows with starlight shafts
    cells(.3,280,(x,i,h)=>{
      ctx.fillStyle='#120e1c';ctx.beginPath();ctx.moveTo(x+90,H);ctx.lineTo(x+90,170);ctx.arc(x+140,170,50,Math.PI,0);ctx.lineTo(x+190,H);ctx.fill();
      if(h>.45){
        const wx=x+120;ctx.fillStyle='#3a4a78';ctx.fillRect(wx,70,40,46);
        ctx.fillStyle='#cfd8ff';for(let k=0;k<3;k++)ctx.fillRect(wx+3+k*11+((t*.3+i)%1>.98?1:0),72+k*13,2,2);
        ctx.fillStyle='#120e1c';for(let k=1;k<4;k++)ctx.fillRect(wx+k*10-1,70,3,46);
        const sh=ctx.createLinearGradient(0,116,0,H);sh.addColorStop(0,'rgba(190,205,255,.16)');sh.addColorStop(1,'rgba(190,205,255,0)');
        ctx.fillStyle=sh;ctx.beginPath();ctx.moveTo(wx,116);ctx.lineTo(wx+40,116);ctx.lineTo(wx+120,H);ctx.lineTo(wx+30,H);ctx.closePath();ctx.fill();
      }
    });
    cells(.6,340,(x,i,h)=>{
      ctx.fillStyle=th.mid;ctx.fillRect(x,0,46,H);ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(x+36,0,10,H);
      if(h>.35){const fl=Math.sin(t*13+i)*2+Math.sin(t*7.3+i*2);glow(x+23,250,120+fl*4,th.accent,.28);
        ctx.fillStyle='#3a2a1c';ctx.fillRect(x+19,258,8,16);ctx.fillStyle='#ffd08a';ctx.beginPath();ctx.ellipse(x+23,250+fl*.5,5,9+fl*.5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff3d0';ctx.beginPath();ctx.ellipse(x+23,253,2.5,4,0,0,Math.PI*2);ctx.fill();}
      if(h<.6){ctx.strokeStyle='#4a4058';ctx.lineWidth=2;const len=80+h*120;for(let y=0;y<len;y+=8){ctx.beginPath();ctx.ellipse(x+110+Math.sin(t+i)*2*(y/len),y,2.5,4,0,0,Math.PI*2);ctx.stroke();}}
    });
  }else if(L.key==='city'){
    glow(700-camX*.02,330,260,'#ffb070',.45);
    ctx.fillStyle='#ffcf8a';ctx.beginPath();ctx.arc(700-camX*.02,330,62,0,Math.PI*2);ctx.fill();
    ridge(.12,380,40,2,'#6a3b58');
    cells(.18,320,(x,i,h)=>{ctx.fillStyle=th.far;const tw=30+h*20,th2=150+h*90;ctx.fillRect(x+40,H-th2-60,tw,th2+60);ctx.beginPath();ctx.moveTo(x+34,H-th2-60);ctx.lineTo(x+40+tw/2,H-th2-120-h*40);ctx.lineTo(x+46+tw,H-th2-60);ctx.fill();});
    ctx.fillStyle=th.far;ctx.fillRect(0,400,W,H);
    cells(.45,86,(x,i,h)=>{
      const bh=110+h*190,top=H-bh;ctx.fillStyle=th.mid;ctx.fillRect(x,top,80,bh);
      if(h>.5){ctx.beginPath();ctx.moveTo(x-6,top);ctx.lineTo(x+40,top-36);ctx.lineTo(x+86,top);ctx.fill();}
      else{ctx.fillRect(x+54,top-30,12,30);}
      for(let wy=top+18;wy<H-20;wy+=26)for(let wx=x+12;wx<x+70;wx+=20){const k=hash(i*97+wy*3+wx);if(k>.62){ctx.fillStyle=hexA(th.accent,.55+.3*Math.sin(t*.5+k*9));ctx.fillRect(wx,wy,8,11);}}
    });
  }else if(L.key==='forest'){
    const mx=210-camX*.02;glow(mx,110,150,'#d9f2ff',.25);ctx.fillStyle='#eef7f2';ctx.beginPath();ctx.arc(mx,110,34,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(180,210,200,.35)';ctx.beginPath();ctx.arc(mx-10,104,7,0,Math.PI*2);ctx.arc(mx+12,118,5,0,Math.PI*2);ctx.fill();
    ridge(.1,330,70,1,'#1b4442');ridge(.2,380,50,4,th.far);
    cells(.45,120,(x,i,h)=>{
      const cx=x+60,base=H-40,ht=220+h*150;ctx.fillStyle='#0a201f';ctx.fillRect(cx-7,base-ht*.6,14,ht*.6+40);
      ctx.fillStyle=th.mid;for(let k=0;k<4;k++){ctx.beginPath();ctx.arc(cx+Math.sin(k*2.1+i)*26,base-ht*.55-k*34,48-k*7,0,Math.PI*2);ctx.fill();}
    });
    const fog=ctx.createLinearGradient(0,330,0,H);fog.addColorStop(0,'rgba(140,200,170,0)');fog.addColorStop(1,'rgba(140,200,170,.14)');ctx.fillStyle=fog;ctx.fillRect(0,330,W,H-330);
  }else{
    const sx=640-camX*.02;glow(sx,300,320,'#ffe2a8',.55);ctx.fillStyle='#fff3d2';ctx.beginPath();ctx.arc(sx,300,74,0,Math.PI*2);ctx.fill();
    peaks(.08,420,300,1,th.far,'#e8eef8');
    cells(.2,420,(x,i,h)=>{ctx.fillStyle='rgba(255,255,255,.55)';const cy=120+h*90,dx=(t*8)%420;ctx.beginPath();ctx.ellipse(x+dx,cy,90,16,0,0,Math.PI*2);ctx.ellipse(x+dx+50,cy-10,50,14,0,0,Math.PI*2);ctx.fill();});
    peaks(.25,470,200,3.3,th.mid,'#d9e2ef');
    cells(.5,64,(x,i,h)=>{if(h<.35)return;const b=H-30,s=40+h*40;ctx.fillStyle='#2f4560';for(let k=0;k<3;k++){ctx.beginPath();ctx.moveTo(x+32-s*.35+k*4,b-k*s*.3);ctx.lineTo(x+32,b-s-k*s*.3+k*s*.2);ctx.lineTo(x+32+s*.35-k*4,b-k*s*.3);ctx.fill();}});
  }
}

function drawAmbient(t,dt){
  const k=L.th.amb;
  for(const a of amb){
    if(k==='dust'){a.y-=dt*(6+a.s*8);a.x+=Math.sin(t+a.p)*dt*6;ctx.fillStyle=`rgba(220,210,255,${.15+a.s*.2})`;ctx.fillRect(a.x,a.y,1.5,1.5);}
    else if(k==='embers'){a.y-=dt*(20+a.s*30);a.x+=Math.sin(t*2+a.p)*dt*20;ctx.fillStyle=`rgba(255,${150+a.s*80|0},90,${.3+a.s*.5})`;ctx.fillRect(a.x,a.y,2,2);}
    else if(k==='fireflies'){a.x+=Math.sin(t*.7+a.p)*dt*14;a.y+=Math.cos(t*.9+a.p*1.3)*dt*10;const al=.5+.5*Math.sin(t*3+a.p*5);glow(a.x,a.y,9,'#c8f59a',.35*al);ctx.fillStyle=`rgba(230,255,190,${al})`;ctx.fillRect(a.x-1,a.y-1,2,2);}
    else{a.x-=dt*(160+a.s*220);a.y+=Math.sin(t+a.p)*dt*10;ctx.strokeStyle=`rgba(255,255,255,${.15+a.s*.3})`;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(a.x+20+a.s*30,a.y);ctx.stroke();}
    if(a.y<-10)a.y=H+10;if(a.y>H+10)a.y=-10;if(a.x<-60)a.x=W+10;if(a.x>W+60)a.x=-10;
  }
}

/* ---------- drawing: world ---------- */
function drawTiles(t){
  const th=L.th,c0=Math.max(0,Math.floor(camX/T)),c1=Math.min(L.cols-1,Math.floor((camX+W)/T));
  for(let r=0;r<ROWS;r++)for(let c=c0;c<=c1;c++){
    const ch=L.grid[r][c];if(ch==='.')continue;
    const x=Math.round(c*T-camX),y=r*T;
    if(ch==='#'){
      ctx.fillStyle=th.tile;ctx.fillRect(x,y,T+1,T);
      ctx.fillStyle=th.tileDark;
      if(th.bricks){ctx.fillRect(x,y+T/2-1,T+1,2);const off=(r%2)?T/2:0;ctx.fillRect(x+off,y,2,T/2);ctx.fillRect(x+(off+T/2)%T,y+T/2,2,T/2);}
      else{const h=hash(c*31+r*7);ctx.fillRect(x+6+h*18,y+12+h*10,4,3);ctx.fillRect(x+22-h*12,y+26,3,3);}
      if(r===0||L.grid[r-1][c]!=='#'){
        ctx.fillStyle=th.top;ctx.fillRect(x,y,T+1,6);
        if(L.key==='forest'){for(let k=0;k<4;k++){const h=hash(c*13+k);ctx.fillRect(x+k*9+h*4,y-3-h*3,2,4+h*3);}}
        if(L.key==='peak'){const h=hash(c*5);ctx.fillRect(x+4+h*10,y+6,8,3+h*4);ctx.fillRect(x+22,y+6,5,2+h*2);}
        if(L.key==='dungeon'||L.key==='city'){ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(x,y,T+1,2);}
      }
    }else if(ch==='='){
      ctx.fillStyle=th.plank;ctx.fillRect(x,y,T+1,10);ctx.fillStyle=th.plankDark;ctx.fillRect(x,y+10,T+1,3);ctx.fillRect(x+T-2,y,2,10);
      ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(x,y,T+1,2);
    }else if(ch==='^'){
      for(let k=0;k<3;k++){const sx=x+k*12;ctx.fillStyle='#c9ced9';ctx.beginPath();ctx.moveTo(sx,y+T);ctx.lineTo(sx+6,y+T-20);ctx.lineTo(sx+12,y+T);ctx.fill();ctx.fillStyle='#8a90a0';ctx.beginPath();ctx.moveTo(sx+6,y+T-20);ctx.lineTo(sx+12,y+T);ctx.lineTo(sx+6,y+T);ctx.fill();}
    }
  }
  for(const m of L.movers){
    const x=Math.round(m.x-camX);if(x>W||x+m.w<0)continue;
    ctx.fillStyle=th.plank;ctx.fillRect(x,m.y,m.w,m.h);ctx.fillStyle=th.plankDark;ctx.fillRect(x,m.y+m.h,m.w,3);
    ctx.fillStyle='rgba(255,255,255,.14)';ctx.fillRect(x,m.y,m.w,2);
    ctx.strokeStyle='rgba(200,200,210,.35)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x+8,m.y);ctx.lineTo(x+8,0);ctx.moveTo(x+m.w-8,m.y);ctx.lineTo(x+m.w-8,0);ctx.stroke();
  }
}

function drawStar(x,y,r,col){
  ctx.fillStyle=col;ctx.beginPath();
  for(let i=0;i<8;i++){const a=i*Math.PI/4-Math.PI/2,rr=i%2?r*.35:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}
  ctx.closePath();ctx.fill();
}
function drawPickups(t){
  const th=L.th;
  for(const s of L.stars){if(s.got)continue;const x=s.x-camX;if(x<-30||x>W+30)continue;const y=s.y+Math.sin(t*3+s.ph)*3;glow(x,y,22,th.accent,.45);drawStar(x,y,8+Math.sin(t*5+s.ph),'#fff8de');}
  for(const c of L.cps){
    const x=Math.round(c.x-camX),y=c.y;if(x<-60||x>W+60)continue;
    ctx.fillStyle='#4a3524';ctx.fillRect(x-2,y-62,4,62);ctx.fillRect(x-2,y-62,18,3);
    ctx.strokeStyle='#4a3524';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x+13,y-59);ctx.lineTo(x+13,y-52);ctx.stroke();
    if(c.lit){const fl=Math.sin(t*11)*2;glow(x+13,y-44,60+fl,th.accent,.5);}
    ctx.fillStyle='#2b2230';ctx.fillRect(x+7,y-52,12,16);ctx.fillStyle=c.lit?'#ffe6a8':'#3e3646';ctx.fillRect(x+9,y-50,8,12);
  }
  if(L.exit){
    const x=L.exit.x+T/2-camX,y=L.exit.y;
    if(x>-160&&x<W+160){
      const pul=.5+.15*Math.sin(t*2.5);glow(x,y-60,150,th.accent,pul);
      ctx.fillStyle=L.th.tileDark;ctx.beginPath();ctx.moveTo(x-34,y);ctx.lineTo(x-34,y-92);ctx.arc(x,y-92,34,Math.PI,0);ctx.lineTo(x+34,y);ctx.closePath();ctx.fill();
      const ig=ctx.createLinearGradient(0,y-120,0,y);ig.addColorStop(0,'#ffffff');ig.addColorStop(1,th.accent);
      ctx.fillStyle=ig;ctx.beginPath();ctx.moveTo(x-22,y);ctx.lineTo(x-22,y-92);ctx.arc(x,y-92,22,Math.PI,0);ctx.lineTo(x+22,y);ctx.closePath();ctx.fill();
      for(let k=0;k<5;k++){const ph=(t*.6+k/5)%1;ctx.fillStyle=`rgba(255,255,255,${1-ph})`;ctx.fillRect(x-14+hash(k)*28,y-ph*120,2,2);}
    }
  }
}

function line(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}

function drawElf(t){
  const p=P;
  if(p.inv>0&&S.mode==='play'&&Math.floor(p.inv*14)%2===0)return;
  const cx=Math.round(p.x+p.w/2-camX),fy=Math.round(p.y+p.h);
  ctx.save();ctx.translate(cx,fy);ctx.scale(p.facing,1);
  const run=Math.abs(p.vx)>20&&p.onGround,air=!p.onGround,ph=p.anim;
  const trail=Math.min(1,Math.abs(p.vx)/270),sway=Math.sin(t*4)*2+(air?(p.vy<0?4:-5):0);
  const bob=run?Math.abs(Math.sin(ph))*-2:0;
  ctx.translate(0,bob);
  // cloak
  ctx.fillStyle='#244f4b';ctx.beginPath();ctx.moveTo(-5,-34);ctx.quadraticCurveTo(-15-trail*8,-22+sway,-13-trail*15,-5+sway*.5);ctx.lineTo(-1,-13);ctx.closePath();ctx.fill();
  // bow on back
  if(p.shootT<=0){ctx.strokeStyle='#8a5a34';ctx.lineWidth=2;ctx.beginPath();ctx.arc(-3,-25,12,-1.9,1.25);ctx.stroke();ctx.strokeStyle='rgba(230,230,230,.5)';ctx.lineWidth=1;line(-3+12*Math.cos(-1.9),-25+12*Math.sin(-1.9),-3+12*Math.cos(1.25),-25+12*Math.sin(1.25));}
  // legs
  let a,b;
  if(air){a=[5,-6];b=[-4,-3];}
  else if(run){a=[Math.sin(ph)*8,-Math.max(0,Math.cos(ph))*5];b=[-Math.sin(ph)*8,-Math.max(0,-Math.cos(ph))*5];}
  else{a=[3,0];b=[-3,0];}
  ctx.lineCap='round';ctx.lineWidth=5;
  ctx.strokeStyle='#36412f';line(0,-15,b[0],b[1]-3);ctx.fillStyle='#2e211a';ctx.fillRect(b[0]-3,b[1]-4,7,4);
  ctx.strokeStyle='#4f5f43';line(0,-15,a[0],a[1]-3);ctx.fillStyle='#3a2a20';ctx.fillRect(a[0]-3,a[1]-4,8,4);
  // torso
  ctx.fillStyle='#6fa65a';ctx.fillRect(-7,-34,14,21);ctx.fillStyle='#5a8e48';ctx.fillRect(-7,-20,14,7);
  ctx.fillStyle='#3a2a20';ctx.fillRect(-7,-19,14,3);ctx.fillStyle='#c9b27a';ctx.fillRect(1,-19,3,3);
  // hair back
  ctx.fillStyle='#e3e6ee';ctx.beginPath();ctx.moveTo(-5,-46);ctx.quadraticCurveTo(-15,-38+sway,-13-trail*7,-25+sway);ctx.lineTo(-3,-31);ctx.closePath();ctx.fill();
  // head
  ctx.fillStyle='#f0d5c0';ctx.beginPath();ctx.arc(1,-40,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#e3e6ee';ctx.beginPath();ctx.arc(0,-41.5,7.6,Math.PI*.95,Math.PI*1.95);ctx.fill();ctx.fillRect(-7,-42,4,8);
  // pointed ear
  ctx.fillStyle='#f0d5c0';ctx.beginPath();ctx.moveTo(-1,-41);ctx.lineTo(-12,-49);ctx.lineTo(-2,-37);ctx.closePath();ctx.fill();
  ctx.fillStyle='#d9b29c';ctx.beginPath();ctx.moveTo(-3,-40);ctx.lineTo(-9,-45);ctx.lineTo(-3,-38);ctx.fill();
  // leaf circlet
  ctx.strokeStyle='#9fd18a';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,-41,7.8,Math.PI*1.05,Math.PI*1.75);ctx.stroke();
  ctx.fillStyle='#1d2a2a';ctx.fillRect(4,-41,2,2);
  // arm, bow, shackle
  let hx,hy;
  if(p.shootT>0){hx=13;hy=-29;ctx.strokeStyle='#8a5a34';ctx.lineWidth=2.2;ctx.beginPath();ctx.arc(10,-29,13,-1.15,1.15);ctx.stroke();ctx.strokeStyle='rgba(235,235,235,.7)';ctx.lineWidth=1;line(10+13*Math.cos(-1.15),-29+13*Math.sin(-1.15),10+13*Math.cos(1.15),-29+13*Math.sin(1.15));}
  else if(air){hx=8;hy=-36;}
  else if(run){hx=-Math.sin(ph)*7;hy=-20;}
  else{hx=2;hy=-19;}
  ctx.strokeStyle='#e6c7b2';ctx.lineWidth=4;line(1,-31,hx,hy);
  ctx.strokeStyle='#cfd5e2';ctx.lineWidth=2;ctx.beginPath();ctx.arc(hx,hy,3.2,0,Math.PI*2);ctx.stroke();
  const swing=Math.sin(t*7)*.5-p.vx*p.facing/500;
  ctx.lineWidth=1.4;for(let k=1;k<=3;k++){const lx=hx+Math.sin(swing)*k*4.5,ly=hy+Math.cos(swing)*k*4.5;ctx.beginPath();ctx.ellipse(lx,ly,1.6,2.6,swing,0,Math.PI*2);ctx.stroke();}
  ctx.restore();
}

function drawEnemy(e,t){
  const x=Math.round(e.x-camX);if(x<-80||x>W+80)return;
  const f=e.flash>0,C=c=>f?'#ffffff':c;
  ctx.save();ctx.translate(x+e.w/2,Math.round(e.y+e.h));ctx.scale(e.dir,1);ctx.lineCap='round';
  if(e.type==='guard'){
    const ph=e.anim*9,l=Math.sin(ph)*6;
    ctx.strokeStyle=C('#3b3d46');ctx.lineWidth=5;line(-2,-16,-l,-2);line(2,-16,l,-2);
    ctx.fillStyle=C('#5d6170');ctx.fillRect(-10,-34,20,20);
    ctx.fillStyle=C('#8e2b35');ctx.fillRect(-7,-33,14,22);ctx.fillStyle=C('#d2b46a');ctx.fillRect(-2,-28,4,4);
    ctx.fillStyle=C('#9097a6');ctx.beginPath();ctx.arc(0,-40,8,0,Math.PI*2);ctx.fill();ctx.fillRect(-9,-40,18,3);
    ctx.fillStyle=C('#1a1b22');ctx.fillRect(2,-42,7,2);
    ctx.strokeStyle=C('#6b4a2e');ctx.lineWidth=2.5;line(10,-4,10,-58);
    ctx.fillStyle=C('#d5dae3');ctx.beginPath();ctx.moveTo(6,-56);ctx.lineTo(10,-68);ctx.lineTo(14,-56);ctx.fill();
    ctx.strokeStyle=C('#5d6170');ctx.lineWidth=4;line(4,-30,10,-24);
  }else if(e.type==='wolf'){
    const ph=e.anim*14;ctx.strokeStyle=C('#14111d');ctx.lineWidth=4;
    line(-14,-12,-14+Math.sin(ph)*6,-1);line(-8,-12,-8-Math.sin(ph)*6,-1);line(10,-12,10-Math.sin(ph)*6,-1);line(15,-12,15+Math.sin(ph)*6,-1);
    ctx.fillStyle=C('#1d1828');ctx.beginPath();ctx.ellipse(0,-16,20,9,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(-18,-18);ctx.quadraticCurveTo(-30,-26+Math.sin(ph*.5)*3,-32,-14);ctx.lineTo(-18,-14);ctx.fill();
    ctx.beginPath();ctx.ellipse(18,-22,9,7,-.2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(22,-22);ctx.lineTo(32,-18);ctx.lineTo(22,-16);ctx.fill();
    ctx.beginPath();ctx.moveTo(13,-27);ctx.lineTo(15,-36);ctx.lineTo(19,-28);ctx.fill();
    if(!f){glow(22,-24,10,'#ff6a5a',.5);}ctx.fillStyle='#ffb0a0';ctx.fillRect(21,-25,3,2);
    ctx.fillStyle='rgba(120,90,170,.25)';ctx.beginPath();ctx.ellipse(0,-16,22,11,0,0,Math.PI*2);ctx.fill();
  }else{
    const fl=Math.sin(t*22+e.t)*.9;ctx.translate(0,-10);ctx.fillStyle=C('#251c33');
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-16,-8*fl);ctx.lineTo(-12,2);ctx.lineTo(-6,0);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(16,-8*fl);ctx.lineTo(12,2);ctx.lineTo(6,0);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd27a';ctx.fillRect(1,-2,2,2);ctx.fillRect(-3,-2,2,2);
  }
  ctx.restore();
}

function drawHUD(){
  const th=L.th;ctx.save();
  for(let i=0;i<S.maxHp;i++){
    const x=28+i*30,y=30,full=i<S.hp;
    ctx.fillStyle=full?'#ff7f8e':'rgba(255,255,255,.15)';ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(x,y+7);ctx.bezierCurveTo(x-13,y-2,x-7,y-12,x,y-5);ctx.bezierCurveTo(x+7,y-12,x+13,y-2,x,y+7);ctx.stroke();ctx.fill();
  }
  drawStar(28,64,9,'#fff8de');
  ctx.font='20px "Gowun Dodum",sans-serif';ctx.textBaseline='middle';ctx.fillStyle='#f2ead9';
  ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=4;
  ctx.fillText(`${S.stars} / ${STARS_TOTAL}`,44,65);
  const ch=CHAPTERS[S.ch];ctx.textAlign='right';ctx.font='15px "Gowun Dodum",sans-serif';ctx.fillStyle=th.accent;ctx.fillText(ch.no,W-24,26);
  ctx.font='24px "Song Myung",serif';ctx.fillStyle='#f2ead9';ctx.fillText(ch.name,W-24,52);
  // progress thread
  const prog=Math.min(1,(P.x)/(L.cols*T-T*3));ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(W-184,72,160,2);ctx.fillStyle=th.accent;ctx.fillRect(W-184,72,160*prog,2);
  ctx.restore();
}

function drawHint(){
  if(S.ch!==0)return;const x=60-camX;if(x<-600)return;
  ctx.save();ctx.font='17px "Gowun Dodum",sans-serif';ctx.fillStyle='rgba(242,234,217,.75)';
  ctx.fillText(coarse?'◀ ▶ 이동   점프 (공중에서 한 번 더)   활 쏘기':'← → 이동   Space 점프 (공중에서 한 번 더)   J 활 쏘기',x+40,330);
  ctx.fillStyle='rgba(255,179,90,.8)';ctx.fillText('적의 머리를 밟거나 화살로 쓰러뜨리세요. 별빛을 모으며 출구의 빛을 향해.',x+40,358);
  ctx.restore();
}

/* ---------- loop ---------- */
let last=performance.now(),acc=0;
function render(t,dt){
  ctx.setTransform(K,0,0,K,0,0);
  let sx=0,sy=0;if(S.shake>0){sx=(Math.random()-.5)*10*S.shake/.3;sy=(Math.random()-.5)*10*S.shake/.3;}
  ctx.save();ctx.translate(sx,sy);
  drawBackground(t);drawAmbient(t,dt);
  drawHint();drawTiles(t);drawPickups(t);
  for(const e of L.enemies)if(!e.dead)drawEnemy(e,t);
  ctx.strokeStyle='#e9e4d8';ctx.lineWidth=2;
  for(const a of arrows){const x=a.x-camX,d=Math.sign(a.vx);line(x-d*18,a.y,x,a.y);ctx.fillStyle='#d6dbe6';ctx.beginPath();ctx.moveTo(x+d*5,a.y);ctx.lineTo(x,a.y-3);ctx.lineTo(x,a.y+3);ctx.fill();ctx.fillStyle='#9fd18a';ctx.fillRect(x-d*20-2,a.y-3,4,6);}
  drawElf(t);
  for(const q of parts){ctx.globalAlpha=Math.max(0,q.life/q.max);ctx.fillStyle=q.color;ctx.fillRect(q.x-camX-q.size/2,q.y-q.size/2,q.size,q.size);}
  ctx.globalAlpha=1;ctx.restore();
  const v=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,`rgba(4,3,8,${L.th.vig})`);ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  if(S.mode==='play'||S.mode==='pause')drawHUD();
  if(S.fade>0){ctx.fillStyle=`rgba(5,4,10,${S.fade})`;ctx.fillRect(0,0,W,H);}
}
function frameLoop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;
  if(S.mode==='play'){acc+=dt;while(acc>=STEP){update(STEP);acc-=STEP;}}
  else{acc=0;if(S.mode==='title'){camX=(Math.sin(clock*.08)*.5+.5)*900;}}
  touch.classList.toggle('on',coarse&&S.mode==='play');
  render(clock,dt);
  requestAnimationFrame(frameLoop);
}

/* ---------- screens ---------- */
function show(html){panel.innerHTML=html;panel.hidden=false;}
function hide(){panel.hidden=true;}
const fmtTime=s=>`${Math.floor(s/60)}분 ${String(Math.floor(s%60)).padStart(2,'0')}초`;
function titleScreen(){
  S.mode='title';
  show(`<p class="eyebrow">엘프 세린의 여정</p>
  <h1 class="logo">끊어진 사슬</h1>
  <p class="lede">은 사슬에 묶여 백 년을 보낸 엘프 세린. 지하 감옥에서 바람의 고개까지, 네 개의 땅을 건너 자유를 찾아 떠납니다.</p>
  <dl class="keys">
    <div><dt>← →</dt><dd>이동 (A D)</dd></div>
    <div><dt>Space</dt><dd>점프, 공중에서 한 번 더</dd></div>
    <div><dt>J</dt><dd>활 쏘기 (X)</dd></div>
    <div><dt>Esc</dt><dd>잠시 멈춤 · M 소리</dd></div>
  </dl>
  <div class="row"><button type="button" data-act="start">여정을 시작하기</button><span class="hint">Enter로도 시작합니다</span></div>`);
}
function storyScreen(i){
  S.ch=i;loadLevel(i);S.mode='story';const c=CHAPTERS[i];
  show(`<p class="eyebrow">${c.no}</p><h2 class="chap">${c.name}</h2>${c.text.map(s=>`<p class="story">${s}</p>`).join('')}
  <div class="row"><button type="button" data-act="go">길을 나서기</button><span class="hint">Enter</span></div>`);
}
function completeChapter(){
  sfx('win');
  if(S.ch<CHAPTERS.length-1){storyScreen(S.ch+1);return;}
  S.mode='end';
  show(`<p class="eyebrow">끝, 그리고 시작</p><h2 class="chap">바람의 하늘</h2>
  <p class="story">고개 꼭대기에서 해가 떠올랐다. 세린은 손목에 남은 마지막 사슬 고리를 풀어 계곡 아래로 던졌다.</p>
  <p class="story">이제 이 길은 누구의 명령도 아닌, 세린이 고른 길이다.</p>
  <p class="stats"><span>모은 별빛<b>${S.stars} / ${STARS_TOTAL}</b></span><span>걸린 시간<b>${fmtTime(S.time)}</b></span><span>쓰러진 횟수<b>${S.falls}</b></span></p>
  <div class="row"><button type="button" data-act="restart">처음부터 다시</button></div>`);
}
function togglePause(){
  if(S.mode==='play'){S.mode='pause';show(`<p class="eyebrow">잠시 멈춤</p><h2 class="chap">숨을 고르는 중</h2><p class="lede">별빛 ${S.stars} / ${STARS_TOTAL} · ${fmtTime(S.time)}</p><div class="row"><button type="button" data-act="resume">계속하기</button><span class="hint">Esc</span></div>`);}
  else if(S.mode==='pause'){hide();S.mode='play';}
}
panel.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;initAudio();
  const act=b.dataset.act;
  if(act==='start'||act==='restart'){S.stars=0;S.time=0;S.falls=0;S.hp=S.maxHp;storyScreen(0);}
  else if(act==='go'){hide();S.hp=S.maxHp;S.mode='play';last=performance.now();}
  else if(act==='resume'){hide();S.mode='play';}
});

try{window.claude?.hot?.snapshot?.(()=>({ch:S.ch,stars:S.stars,time:S.time,falls:S.falls,started:S.mode!=='title'}));}catch(e){}
function start(data){
  data=data||{};
  if(data.started&&typeof data.ch==='number'){S.stars=data.stars||0;S.time=data.time||0;S.falls=data.falls||0;storyScreen(Math.min(data.ch,CHAPTERS.length-1));}
  else{loadLevel(0);titleScreen();}
  requestAnimationFrame(frameLoop);
}
const hot=window.claude?.hot;
if(hot?.ready)hot.ready(start);else start(hot?.data??{});
})();
</script>
